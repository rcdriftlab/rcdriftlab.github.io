<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>RC Drift Lab · by Stranger Kreations</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d0e13"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Drift Lab"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="Free 1/10 RC drift game by Stranger Kreations. Drift solo, against AI, or online with friends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c10;--pn:rgba(13,14,19,.88);--ln:rgba(255,255,255,.1);--tx:#eef0f4;--mut:#a3abb8;--ac:#ff5a1f;--ac2:#35e0ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Chakra Petch',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button,input{font:inherit;color:inherit}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:40px;text-align:center;z-index:9}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.inmenu #hud,.nohud #hud{display:none}
#hTL,#hBL,#hBR,#hB{background:rgba(8,9,12,.5);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:10px 14px}
#hTL{position:absolute;left:18px;top:16px;min-width:210px}
#hTL .lbl{font-size:11px;letter-spacing:.18em;color:var(--mut)}
#hScore{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#hRunRow{height:30px;font-size:24px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
#hMult{margin-left:8px;color:#ffd21a}
#hTand{display:inline-block;margin-top:2px;padding:3px 10px;font-size:13px;font-weight:700;letter-spacing:.16em;border:1px solid var(--ac2);color:var(--ac2);opacity:0;transition:opacity .15s}
#hTand.on{opacity:1}
#hZone{display:inline-block;margin:2px 0 0 6px;padding:3px 8px;font-size:13px;font-weight:700;letter-spacing:.08em;background:#ffd21a;color:#141008;opacity:0;transition:opacity .12s;font-variant-numeric:tabular-nums}#hZone.on{opacity:1}
#hLap{margin-top:8px;font-size:13px;color:#cfd4dc;font-variant-numeric:tabular-nums}
#hTR{position:absolute;right:18px;top:16px;text-align:right}
#mini{display:block;margin-left:auto;background:rgba(8,9,12,.45);border:1px solid var(--ln);border-radius:6px}
#hNet,#hCam{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:4px;background:rgba(8,9,12,.55);font-size:11px;letter-spacing:.14em;color:#c5cbd6}#hNet.on{color:var(--ac2)}
#hCam{margin-left:4px}
#hB{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(420px,60vw);text-align:center}
#hAng{font-size:54px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#hAngL{font-size:11px;letter-spacing:.2em;color:var(--mut)}
#track{position:relative;height:8px;margin:10px 0 0;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden}
#track:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;opacity:.6}
#hBar{position:absolute;inset:0;border-radius:4px;transform-origin:center}
#hBR{position:absolute;right:18px;bottom:18px;display:flex;gap:14px;align-items:flex-end;text-align:right}
#hSpd{font-size:44px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.unit{font-size:11px;letter-spacing:.16em;color:var(--mut)}
#thrBox{width:10px;height:74px;background:rgba(255,255,255,.14);border-radius:3px;position:relative;overflow:hidden}
#hThr{position:absolute;left:0;right:0;bottom:0;background:var(--ac)}
#hBL{position:absolute;left:18px;bottom:18px;font-size:12px;color:var(--mut);line-height:1.7}
#hBL b{color:var(--tx);font-weight:600}
#hGyro{color:var(--ac2);font-weight:700;font-size:20px}
#tour{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(5,6,9,.62);backdrop-filter:blur(3px);padding:14px}
#tour .tcard{width:min(460px,94vw);max-height:90vh;overflow:auto;background:#0f1116;border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:8px;padding:18px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#tour h2{margin:4px 0 10px;font-size:22px;font-style:italic;letter-spacing:.02em}#tour .tstep{font-size:11px;letter-spacing:.2em;color:var(--ac2)}
#tour .tbody{font-size:15px;line-height:1.45;color:#d9dde5}#tour .tbody b{color:#fff}#tour ol,#tour ul{margin:6px 0 8px;padding-left:20px}#tour li{margin:3px 0}#tour .tmut{color:var(--mut);font-size:13px}
#tour .tkeys{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:4px 0 10px;font-size:13px;color:var(--mut)}#tour kbd{background:#1b1e26;border:1px solid var(--ln);border-radius:4px;padding:2px 7px;color:#fff;font-family:inherit;font-size:12px}
#tour .tbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}#tour .tbtns .big,#tour .tbtns .ghost{display:inline-block;width:auto;margin:0;font-size:15px;padding:10px 16px}#tour .tbtns button{min-width:84px}#tour .tbtns button:empty{display:none}
#toast{position:fixed;left:50%;top:17%;transform:translate(-50%,-8px);padding:8px 18px;background:rgba(10,11,15,.8);border:1px solid var(--ln);border-radius:4px;font-weight:700;letter-spacing:.1em;font-size:15px;opacity:0;transition:.18s;pointer-events:none;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.good{color:#5dff9c}#toast.bad{color:#ff6b5a}
/* ---------- menu ---------- */
#menu{position:fixed;left:0;top:0;bottom:0;width:min(560px,100vw);display:none;flex-direction:column;background:linear-gradient(90deg,var(--pn) 82%,rgba(13,14,19,0));padding:26px 56px 0 28px}
.inmenu #menu{display:flex}
.paused #menu{background:var(--pn);padding-right:28px;border-right:1px solid var(--ln)}
h1{margin:0 0 0 -10px;line-height:0}.logo{display:block;width:min(400px,86vw);height:auto;filter:drop-shadow(0 3px 10px rgba(0,0,0,.55))}
.credit{margin:22px 0 4px;padding-top:12px;border-top:1px solid var(--ln);font-size:11px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}.credit b{color:var(--ac2)}
.sub{margin:6px 0 16px;font-size:12px;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
#nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--ln);margin-bottom:6px}
.nav{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px 10px;font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);cursor:pointer}
.nav:hover{color:var(--tx)}.nav.act{color:var(--tx);border-color:var(--ac)}
#panel{flex:1;overflow-y:auto;padding:8px 10px 40px 0;scrollbar-width:thin;scrollbar-color:#3a3d46 transparent}
h3{margin:20px 0 8px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);font-weight:700}
.big{display:block;width:100%;margin:10px 0 6px;padding:15px;border:0;border-radius:4px;background:var(--ac);color:#140a04;font-size:22px;font-weight:700;font-style:italic;letter-spacing:.1em;cursor:pointer}
.big:hover{filter:brightness(1.1)}
.ghost{display:block;width:100%;margin:6px 0;padding:10px;border:1px solid var(--ln);border-radius:4px;background:rgba(255,255,255,.04);font-weight:600;cursor:pointer;text-align:center}
.ghost:hover{border-color:var(--ac)}
.row{display:grid;grid-template-columns:132px 1fr;gap:4px 12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row>label{font-size:13px;font-weight:600}
.row>.tip{grid-column:1/-1;margin:0}
.tip{font-size:12px;line-height:1.45;color:var(--mut);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.col{flex-direction:column}.chips.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.chip{padding:7px 11px;border:1px solid var(--ln);border-radius:4px;background:rgba(255,255,255,.04);font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.chip small{display:block;font-weight:400;font-size:11px;color:var(--mut);margin-top:1px}
.chip:hover{border-color:rgba(255,255,255,.35)}.chip.act{border-color:var(--ac);background:rgba(255,90,31,.16)}
.sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.swb{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.18);cursor:pointer;padding:0;font-size:9px;color:var(--mut);background:#16171c}
.swb.act{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.sw input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--ln);border-radius:4px;background:none;cursor:pointer}
.sl{display:flex;align-items:center;gap:10px}
.sl input{flex:1;accent-color:var(--ac);min-width:0}
.sl output{min-width:86px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
input[type=text]{width:100%;padding:8px 10px;background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:4px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin-bottom:8px}
kbd{display:inline-block;min-width:26px;padding:2px 7px;margin-right:8px;border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;border-radius:4px;font:inherit;font-size:12px;font-weight:600;background:rgba(255,255,255,.06)}
.keys span{color:var(--mut)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
/* ---------- touch controls ---------- */
#touch{position:fixed;inset:0;display:none;touch-action:none;-webkit-user-select:none;user-select:none;z-index:3}
.touch body:not(.inmenu) #touch{display:block}
.tz{position:absolute;top:0;bottom:0;width:50%}#tzL{left:0}#tzR{right:0}
.stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(10,11,15,.25);pointer-events:none;opacity:.35;transition:opacity .15s}
.stick.on{opacity:1}.stick .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(0,0,0,.5)}
#tthr .knob{background:var(--ac)}
.stick .lbl{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.7)}
#tbtns{position:absolute;top:12px;z-index:2;left:50%;transform:translateX(-50%);display:flex;gap:6px}
#tbtns button{min-width:52px;height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0 10px;border:1px solid rgba(255,255,255,.25);border-radius:6px;background:rgba(10,11,15,.55);font-size:12px;font-weight:700;letter-spacing:.06em}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(8,9,12,.92);z-index:9;font-size:18px;font-weight:700;text-align:center;padding:30px}
@media (orientation:portrait){.touch body:not(.inmenu) #rotate{display:flex}}
html.rot #rotate{display:none!important}.touch body:not(.inmenu) #hTL{pointer-events:auto;cursor:pointer}.touch body:not(.inmenu) #hud{z-index:4}html.narrow #tbtns{gap:5px;top:8px}html.narrow #tbtns button{min-width:42px;padding:0 7px;font-size:11px}html.narrow #hTL{min-width:0;max-width:150px}html.narrow #mini{width:130px;height:87px}html.rot body.paused #menu{width:min(600px,100%)}#tbtns .rotOnly{display:none}html.rot #tbtns .rotOnly{display:inline-block}
html.rot #hTL{top:8px;left:8px;min-width:150px;padding:6px 10px}html.rot #hScore{font-size:26px}html.rot #hRunRow{height:22px;font-size:17px}html.rot #hLap{font-size:11px;margin-top:4px}
html.rot #mini{width:150px;height:100px}html.rot #hTR{top:8px;right:8px}html.rot #hB{bottom:8px;width:min(260px,40vh);padding:6px 10px}html.rot #hAng{font-size:30px}html.rot #hBR{display:none}html.rot #chat{width:min(400px,62vh)}
.touch #hBL{display:none}
@media (max-height:520px){.logo{width:min(250px,60vw)}.sub{display:none}#menu{padding-top:12px}.nav{padding:7px 9px 8px;font-size:12px}
 #hTL{top:8px;left:8px;min-width:150px;padding:6px 10px}#hScore{font-size:26px}#hRunRow{height:22px;font-size:17px}#hLap{font-size:11px;margin-top:4px}
 #mini{width:150px;height:100px}#hTR{top:8px;right:8px}#hB{bottom:8px;width:min(260px,40vw);padding:6px 10px}#hAng{font-size:30px}#hBR{bottom:8px;right:auto;left:50%;transform:translateX(150px);display:none}}

@media (max-width:700px){#hBL,#hCam{display:none}#hAng{font-size:40px}.chips.grid{grid-template-columns:1fr 1fr}}
.lb{display:grid;gap:2px;margin:6px 0 10px}.lbr{display:grid;grid-template-columns:3em 1fr auto;gap:8px;padding:6px 8px;background:rgba(255,255,255,.04);font-variant-numeric:tabular-nums}.lbr.me{background:rgba(255,106,31,.22)}.lbn{opacity:.6}.lbp{font-weight:700}
/* ---------- menu v2: section cards, track maps, meters, rosters ---------- */
#nav{position:sticky;top:0;z-index:2;gap:0}.nav{padding:9px 7px 10px;font-size:12px;letter-spacing:.05em}
.sec{background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:2px 14px 10px;margin:12px 0}
.sec>h3{margin:12px 0 4px;display:flex;align-items:center;gap:8px}.sec>h3:before{content:'';width:3px;height:12px;background:var(--ac);border-radius:2px}
.sec>h3 .h3r{margin-left:auto;color:var(--mut);letter-spacing:.08em;font-weight:600;text-transform:none;font-size:11px}
.sec .row:last-child{border-bottom:0}.sec>.ghost:last-child{margin-bottom:4px}
.big.dis,.ghost[disabled],.chip[disabled]{opacity:.5;cursor:default;filter:none}
.chip.trk{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:6px 10px 6px 6px}
.chip.trk img{width:64px;height:40px;border-radius:4px;background:rgba(0,0,0,.35)}.chip.trk .pb{color:#ffd21a;font-weight:700}
.chips.trks{display:grid;grid-template-columns:1fr;gap:6px}.chips.trks.two{grid-template-columns:1fr 1fr}.chips.trks.two .chip.trk small{display:none}
.btnrow{display:flex;gap:6px}.btnrow .ghost{margin:0;padding:7px 10px;flex:1;font-size:13px}
.slot{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}.slot b{font-size:13px}.slot small{display:block;color:var(--mut);font-size:11px}
.slot .ghost{margin:0;padding:6px 12px;width:auto;font-size:12px}
.meter{display:grid;grid-template-columns:70px 1fr 78px;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin:4px 0}
.meter .mb{position:relative;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}.meter .mb i{position:absolute;top:0;bottom:0;background:var(--ac2);border-radius:4px}
.meter output{text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}
.roster{display:grid;gap:3px;margin:6px 0 8px}.roster div{display:flex;justify-content:space-between;padding:6px 10px;background:rgba(255,255,255,.04);border-radius:4px;font-size:13px}.roster .me{background:rgba(255,90,31,.18)}.roster small{color:var(--mut)}
.code{font-size:30px;font-weight:700;letter-spacing:.3em;color:var(--ac2);text-align:center;padding:6px 0 2px}
.status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.1em;background:rgba(93,255,156,.14);color:#5dff9c}.status.off{background:rgba(255,255,255,.08);color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}.stats .st{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:7px 6px;text-align:center}
.stats b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.stats span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.stats .live b{color:#5dff9c}.stats .live b:before{content:'● ';font-size:11px;vertical-align:2px}
.grp{margin:12px 0 4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700}
.nav{position:relative}.nav .badge{display:inline-block;margin-left:5px;min-width:16px;padding:0 4px;border-radius:8px;background:var(--ac);color:#140a04;font-style:normal;font-size:10px;line-height:16px;text-align:center;vertical-align:1px}.nav .badge.live{background:none;color:#5dff9c;padding:0;min-width:0}
.lbr.lbr3{grid-template-columns:1.1fr 1.2fr auto}.lbr.click{cursor:pointer}.lbr.click:hover{background:rgba(255,255,255,.08)}.lbr .lbd small{color:var(--mut);font-size:11px}.lbr.gold .lbn{color:#ffd21a;opacity:1}.lbr.silver .lbn{color:#d7dde6;opacity:1}.lbr.bronze .lbn{color:#e0975a;opacity:1}
.thread{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:6px 2px;margin:4px 0 8px}.thread.small{max-height:180px}
.bub{max-width:82%;align-self:flex-start;background:rgba(255,255,255,.07);border-radius:10px 10px 10px 3px;padding:6px 10px;font-size:13px;line-height:1.35;word-wrap:break-word}.bub.me{align-self:flex-end;background:rgba(53,224,255,.16);border-radius:10px 10px 3px 10px}.bub small{display:block;font-size:10px;color:var(--mut);margin-top:2px}
.inbox{display:grid;gap:4px;margin:6px 0}.conv{position:relative;display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:6px;padding:8px 10px;cursor:pointer}.conv:hover{border-color:rgba(255,255,255,.2)}
.conv>div{display:flex;justify-content:space-between}.conv b{font-size:13px}.conv small{color:var(--mut);font-size:11px}.conv span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}.conv.new{border-color:rgba(255,90,31,.5)}.conv.new span{color:var(--tx)}
.conv i{position:absolute;right:10px;bottom:9px;font-style:normal;font-size:10px;font-weight:700;background:var(--ac);color:#140a04;border-radius:8px;padding:0 5px;line-height:16px}
.pcard .tcard{border-top-color:var(--ac2)}.pcard .lbr{font-size:13px}
#chat{position:fixed;left:18px;bottom:128px;width:min(400px,62vw);z-index:4;pointer-events:none}.inmenu #chat{display:none}
#chatLog div{background:rgba(8,9,12,.62);padding:4px 10px;border-radius:4px;margin-top:3px;font-size:13px;transition:opacity .6s;text-shadow:none;width:fit-content;max-width:100%}#chatLog b{color:var(--ac2)}
#chatIn{display:none;pointer-events:auto;margin-top:6px;background:rgba(8,9,12,.85)}#chat.typing #chatIn{display:block}
#tbtns [data-a=chat]{display:none}.inroomOnly{display:none}.inroom .inroomOnly{display:inline}.inroom #tbtns [data-a=chat]{display:inline-block}
#menu{width:min(600px,100vw);padding-right:34px}#nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}.nav{flex:0 0 auto}
#hZone.on.warn{background:rgba(255,210,26,.16);border-color:#ffd21a;color:#ffd21a}
@media (max-width:560px){#nav{flex-wrap:wrap;overflow:visible}.nav{font-size:11px;padding:8px 6px 9px;letter-spacing:.04em}}
@media (max-width:700px){.stats b{font-size:15px}.stats span{font-size:9px;letter-spacing:.06em}}
select{width:100%;padding:8px 10px;background:#1a1c23;border:1px solid var(--ln);border-radius:4px;color:var(--tx);font:inherit}
.venmo{display:block;text-align:center;text-decoration:none;background:#008cff;color:#fff;border:0;font-weight:700}.venmo:hover{background:#1a9bff}.venmoLink{color:#4fb2ff;text-decoration:underline}
.newb{display:inline-block;margin-left:6px;padding:1px 5px;border-radius:4px;background:#ff5a1f;color:#fff;font-size:9px;font-weight:800;letter-spacing:.08em;vertical-align:middle}

</head>
